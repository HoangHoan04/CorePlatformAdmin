<div nz-dropdown nzTrigger="click" [nzDropdownMenu]="langMenu">
  <button class="navbar-action" [title]="'navbar.changeLanguage' | translate">
    @if (langSvc.flagOf(current?.code || s.language); as flag) {
      <img [src]="flag" [alt]="langSvc.shortCode(s.language)" class="lang-icon" />
    } @else {
      <span class="lang-code">{{ langSvc.shortCode(current?.code || s.language) }}</span>
    }
  </button>
</div>
<nz-dropdown-menu class="lang-dropdown" #langMenu="nzDropdownMenu">
  <ul class="lang-menu" nz-menu>
    @for (lang of languages; track lang.code) {
      <li class="lang-item" nz-menu-item (click)="setLanguage(lang.code)">
        @if (langSvc.flagOf(lang.code); as flag) {
          <img [src]="flag" [alt]="lang.code" class="lang-icon" />
        } @else {
          <span class="lang-code">{{ langSvc.shortCode(lang.code) }}</span>
        }
        <span class="lang-text">{{ lang.nativeName }}</span>
        @if (isCurrent(lang.code)) {
          <span nz-icon nzType="check" nzTheme="outline" class="lang-check"></span>
        }
      </li>
    }
  </ul>
</nz-dropdown-menu>
